<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Move Party Camera</title>
<style>
/* The phone is a camera stand: show a preview to aim it, then go fully black (AMOLED = almost no power, less heat). */
:root { --ink: #1d1440; --paper: #fff6e0; --sun: #ffc93c; --tomato: #ff5b4f; --sky: #38c6ff; --mint: #41e2a4 }
[hidden] { display: none !important }
html, body { margin: 0; height: 100%; background: #000; color: var(--paper); font: 700 17px/1.4 system-ui, sans-serif; overflow: hidden }
#setup { position: fixed; inset: 0; display: grid; align-content: center; gap: 14px; padding: 18px; text-align: center; background: var(--ink) }
h1 { margin: 0; font-size: 2.2rem; color: var(--sun) }
p { margin: 0 }
video { width: 100%; max-height: 42vh; object-fit: contain; background: #000; border: 3px solid var(--sun); border-radius: 12px; transform: scaleX(-1) }
video.back { transform: none }
button { font: 800 1.25rem system-ui, sans-serif; color: var(--ink); background: var(--sun); border: 0; border-radius: 999px; padding: .75em 1.4em }
button.alt { background: transparent; color: var(--sky); border: 2px solid var(--sky) }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap }
#status { color: var(--sky); min-height: 1.4em }
#dark { position: fixed; inset: 0; background: #000; display: grid; place-items: end center; padding-bottom: 18px }
#dark p { color: #333; font-size: 13px }   /* barely lit pixels on purpose */
</style>
</head>
<body>
<div id="setup">
  <h1>Move Party Camera</h1>
  <p id="hint">Stand the phone up below the TV, sideways, about belly height.</p>
  <video id="v" playsinline muted autoplay hidden></video>
  <p id="status">Getting ready…</p>
  <div class="row">
    <button id="start">Start camera</button>
    <button id="flip" class="alt" hidden>Switch camera</button>
  </div>
  <div class="row"><button id="go" hidden>Looks good, go dark</button></div>
</div>
<div id="dark" hidden><p id="dstat">Tracking… tap to see the camera</p></div>

<script src="peerjs.min.js"></script>
<script type="module">
// --- settings ---
const TRACK_FPS = 20;            // pose updates per second sent to the TV; the TV smooths between them
const CAM = { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30, max: 30 } };
const LIB = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';

// --- wire format (keep in sync with the TV app) ---
// phone -> TV:  1 pose [u8 1][u8 n][u16 seq][u16 camW][u16 camH] then n x (u16 x, u16 y, u8 vis); x,y mapped from [-0.5, 1.5]
//               2 nobody in view [u8 2]
//               3 pong [u8 3][f64 echoed time]
// TV -> phone: 10 ping [u8 10][f64 time]   11 pause   12 resume
const enc = v => Math.round((Math.min(1.5, Math.max(-0.5, v)) + 0.5) / 2 * 65535);

const $ = s => document.querySelector(s);
const video = $('#v'), status = $('#status'), dstat = $('#dstat');
const tvId = decodeURIComponent(location.hash.slice(1));
let facing = 'user', pose, conn, peer, paused = false, seq = 0, lastSent = 0, fps = 0, inferMs = 0;

const say = t => { status.textContent = t; dstat.textContent = t + ' · tap to see the camera'; };
if (!tvId) { say('Scan the QR code on the TV to open this page.'); $('#start').disabled = true; }

// --- connection to the TV (WebRTC data channel; unordered + unreliable = lowest lag, a lost frame is just skipped) ---
function connect() {
  if (!tvId) return;
  peer ??= new Peer(undefined, window.PEER_OPTS || { debug: 1 });
  peer.on?.('error', e => { if (e.type === 'peer-unavailable') say('TV not found. Is the game open on the TV?'); });
  const open = () => {
    conn = peer.connect(tvId, { reliable: false, serialization: 'raw' });
    conn.on('open', () => say('Connected to the TV ✓'));
    conn.on('data', onTv);
    conn.on('close', () => { say('Lost the TV, reconnecting…'); setTimeout(open, 1500); });
    conn.on('error', () => {});
  };
  peer.open ? open() : peer.on('open', open);
}
function onTv(data) {
  const b = data instanceof ArrayBuffer ? new DataView(data) : new DataView(data.buffer, data.byteOffset, data.byteLength);
  const t = b.getUint8(0);
  if (t === 10 && conn?.open) { const out = new DataView(new ArrayBuffer(9)); out.setUint8(0, 3); out.setFloat64(1, b.getFloat64(1)); conn.send(out.buffer); }
  if (t === 11) paused = true;   // TV is in a menu: stop tracking to keep the phone cool
  if (t === 12) paused = false;
}

// --- camera ---
async function openCam() {
  video.srcObject?.getTracks().forEach(t => t.stop());
  const stream = await navigator.mediaDevices.getUserMedia({ video: { ...CAM, facingMode: facing }, audio: false });
  video.srcObject = stream; video.classList.toggle('back', facing !== 'user');
  await video.play();
}

// --- tracking loop: run the model at TRACK_FPS, not every camera frame ---
function sendPose(lm) {
  if (!conn?.open) return;
  if (!lm) { conn.send(new Uint8Array([2]).buffer); return; }
  const n = lm.length, b = new DataView(new ArrayBuffer(8 + n * 5));
  b.setUint8(0, 1); b.setUint8(1, n); b.setUint16(2, seq++ & 0xffff); b.setUint16(4, video.videoWidth); b.setUint16(6, video.videoHeight);
  for (let i = 0; i < n; i++) {
    const p = lm[i], o = 8 + i * 5;
    b.setUint16(o, enc(p.x)); b.setUint16(o + 2, enc(p.y)); b.setUint8(o + 4, Math.round(Math.min(1, Math.max(0, p.visibility ?? 1)) * 255));
  }
  conn.send(b.buffer);
}
let frames = 0, fpsT = performance.now();
function tick() {
  const now = performance.now();
  if (!paused && video.readyState >= 2 && now - lastSent >= 1000 / TRACK_FPS - 4) {
    lastSent = now;
    const t0 = performance.now();
    const lm = pose.detectForVideo(video, now).landmarks[0];
    inferMs += (performance.now() - t0 - inferMs) * 0.1;
    sendPose(lm); frames++;
  }
  if (now - fpsT > 1000) {
    fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now;
    if (conn?.open) say(paused ? 'Paused (TV menu) ✓' : `Tracking ${fps.toFixed(0)}/s · ${inferMs.toFixed(0)} ms`);
  }
  video.requestVideoFrameCallback ? video.requestVideoFrameCallback(tick) : requestAnimationFrame(tick);
}

$('#start').onclick = async () => {
  $('#start').disabled = true;
  try { await openCam(); } catch (e) { say('Camera blocked: allow camera access for this page, then reload.'); $('#start').disabled = false; return; }
  video.hidden = false; $('#flip').hidden = false; $('#start').hidden = true;
  $('#hint').textContent = 'Can it see you from head to knees, 2–3 steps back?';
  say('Loading the body tracker…');
  try {
    const { PoseLandmarker, FilesetResolver } = await import(LIB);
    const files = await FilesetResolver.forVisionTasks(WASM);
    const make = delegate => PoseLandmarker.createFromOptions(files, { baseOptions: { modelAssetPath: MODEL, delegate }, runningMode: 'VIDEO', numPoses: 1 });
    pose = await make('GPU').catch(() => make('CPU'));
  } catch (e) { say('Could not load the tracker. Check the internet and reload.'); return; }
  $('#go').hidden = false;
  navigator.wakeLock?.request('screen').catch(() => {});
  connect(); tick();
};
$('#flip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; openCam().catch(() => say('That camera would not start.')); };
$('#go').onclick = () => { $('#setup').hidden = true; $('#dark').hidden = false; document.documentElement.requestFullscreen?.().catch(() => {}); };
$('#dark').onclick = () => { $('#dark').hidden = true; $('#setup').hidden = false; };
document.addEventListener('visibilitychange', () => { if (!document.hidden) navigator.wakeLock?.request('screen').catch(() => {}); });
if (tvId) say('Tap Start camera.');
</script>
</body>
</html>
